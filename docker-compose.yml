services:
  cynthion-telemetry:
    build: .
    image: cynthion-telemetry:latest
    container_name: cynthion-telemetry
    restart: unless-stopped
    env_file: .env
    environment:
      LISTEN_ADDR: ":8090"
      DB_PATH: "/data/events.db"
    volumes:
      - ./data:/data
    ports:
      # Loopback for local curls; public traffic is Caddy on cynthion-net
      # (api.cynthiongame.com → cynthion-telemetry:8090).
      - "127.0.0.1:8090:8090"
    networks:
      - default
      - cynthion-net
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  cynthion-net:
    external: true
